# =========================================================
# 자금 조류 · 데일리 무인 파이프라인 (GitHub Actions)
# ---------------------------------------------------------
# 기존 로컬 launchd(scripts/com.moneyflow.daily.plist)를 대체하는 클라우드 스케줄러.
# 단일 출처인 scripts/run_daily.sh 를 그대로 호출한다:
#   수집(수급+리서치) → 신호 엔진 테스트 게이트 → 원장 적재/정산 →
#   다이제스트(→ 텔레그램 opt-in) → publish.sh(docs/ 커밋·푸시 → Pages 자동 배포)
#
# 트리거:
#   · cron  — 평일 20:00 KST (= 11:00 UTC 같은 날, 월~금)
#   · 수동  — Actions 탭 "Run workflow" (workflow_dispatch)
#
# 왜 16:00 KST 인가 (2026-08-07 결정 기록):
#   원래는 08:00 KST(23:00 UTC 전일)였다. 그러나 GitHub Actions 의 정시(:00) 큐 혼잡으로
#   실제 기동이 매번 54~71분(평균 62분) 밀려 08:53~09:11 KST 에 떨어졌다 — 즉 한국 증시
#   개장(09:00)선을 사실상 매일 아슬아슬하게 넘나들었다. 30회 중 11회가 09:05 이후 기동.
#   collector 는 네이버 dayCandle 의 마지막 캔들을 취하므로, 개장 후 기동하면 '진행 중인
#   장중 캔들'을 완결된 거래일로 오인해 수집한다(실측: 외국인 순매수가 최대 19.6배 차이,
#   2026-08-04 은 부호까지 반전). 그 값이 OOS 원장에 선착순으로 박히고, 익일의 확정치는
#   중복으로 기각돼 영구히 정정되지 않았다.
#   → 수집을 장 마감(15:30) 이후로 옮긴다.
#   → 시각 이동만으로는 지터가 다시 커질 때 재발하므로, collector.py 에 장중 캔들
#     차단 가드(_pending_session_date)를 함께 둔다. 두 겹의 방어다.
#
# 왜 16:00 이 아니라 20:00 인가 (2026-08-07 실측):
#   처음엔 16:00 KST(마감 30분 후)로 옮겼다. 그 첫 실행(run #40, 17:10 KST)은 개장선과
#   완전히 분리돼 의도대로 동작했지만, as_of 가 당일이 아니라 전 거래일로 나왔다.
#   지수 차트에는 당일이 있는데 '종목 투자자별 수급' 피드에 아직 당일치가 없어서
#   common_window() 가 공통 관측일까지 창을 물린 것이다(설계대로의 동작).
#   관측 두 점 — 17:10 KST 에는 없고, 2026-06-14 21:18 KST 실행에는 있었다.
#   → 게시 시점이 그 사이이므로 20:00 KST 로 늦춘다. 관측 최대지연(163분)을 얹어도
#     22:43 로 자정 전이라 날짜가 넘어가지 않는다.
#   여전히 당일치를 못 받는 날이면 as_of 가 하루 물러날 뿐 어긋난 값은 나가지 않는다.
#
# 텔레그램(opt-in): 리포 Secrets 에 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 등록 시 전송.
#   미설정이면 digest 는 출력만 하고 전송하지 않는다(§8: Alert 이상만 푸시).
#
# 주의: collector 는 네이버 금융 스크래핑이므로 러너의 아웃바운드 네트워크가
#       네이버에 닿아야 한다. 수집 실패 시 run_daily.sh 가 중단되어(set -e)
#       잡이 실패로 표시되며, 직전 발행본(docs/)은 그대로 유지된다(거짓 데이터 미발행).
# =========================================================
name: daily-money-flow

on:
  schedule:
    # 분 시 일 월 요일 (UTC). 11:00 UTC 월~금 = 20:00 KST 월~금.
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

# docs/ 를 main 에 커밋·푸시하기 위해 쓰기 권한 필요.
permissions:
  contents: write

# 동시 실행 방지(이전 실행이 끝나기 전 새 실행이 겹치지 않도록).
concurrency:
  group: daily-money-flow
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      # 정기 실행(schedule)에서 github.ref_name 은 기본 브랜치(main)라 동작은 그대로다.
      # 수동 실행(workflow_dispatch)에서는 고른 브랜치를 그대로 체크아웃하므로, 파이프라인
      # 변경을 main 에 합치기 '전에' 실제로 한 사이클 돌려 검증할 수 있다.
      - name: Checkout (dispatched ref, 기본 main)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          chmod +x scripts/run_daily.sh scripts/publish.sh
          scripts/run_daily.sh
